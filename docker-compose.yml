version: '2.2'
services:
  profiledb:
    image: postgres:9.6
    container_name: profiledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/srv-profile-db:/docker-entrypoint-initdb.d
  vh-srv-profile:
    image: "${IMAGE_NAME}"
    container_name: 'vh-srv-profile'
    restart: unless-stopped
    environment: 
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      APP_PORT: ${APP_PORT}
      APP_MODE: ${APP_MODE}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CONFIDENTIAL_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CONFIDENTIAL_CLIENT_SECRET}
      ORDERS_SERVICE_URL: ${ORDERS_SERVICE_URL}
    cpus: '0.5'
    mem_limit: 250M
    ports:
      - 7471:7471
networks:
    default:
        external:
            name: vh
