stages:
  - test
  - build
  - deploy

variables:
  STAGING_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  STAGING_LATEST_IMAGE: $CI_REGISTRY_IMAGE:staging
  PROD_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  PROD_LATEST_IMAGE: $CI_REGISTRY_IMAGE:latest
  STAGING_URL: "https://api.vh-staging.2serv.eu/profiles/" # this is not used by the service
  PRODUCTION_URL: "https://kli.one/register/"

test:
  image: golang:1.21
  stage: test
  services:
    - name: postgres:12
      alias: postgres
    - name: nats:2.10-alpine
      alias: nats
      command: ["-js", "-user", "testuser", "-pass", "testpass"]
  variables:
    # PostgreSQL service configuration
    POSTGRES_DB: profile_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    # Application test configuration
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: postgres
    DB_PASSWORD: postgres
    DB_NAME: profile_test
    DB_SSLMODE: disable
    NATS_URL: "nats://testuser:testpass@nats:4222"
    APP_ENV: test
    APP_MODE: debug
  before_script:
    # Wait for PostgreSQL to be ready
    - apt-get update && apt-get install -y postgresql-client netcat-openbsd
    - until PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c '\q'; do
        echo "PostgreSQL is unavailable - sleeping";
        sleep 2;
      done
    - echo "PostgreSQL is up"
    # Create pgcrypto extension in template1 so all new databases inherit it
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d template1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'
    - echo "pgcrypto extension added to template1"
    # Wait for NATS to be ready
    - until nc -z nats 4222; do
        echo "NATS is unavailable - sleeping";
        sleep 2;
      done
    - echo "NATS is up"
  script:
    - go mod download
    - go test -v -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week
  only:
    - master
    - tags
    - merge_requests

build_staging:
  image: docker:latest
  stage: build
  services:
    - docker:26.0.0-dind
  script:
    - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN $CI_REGISTRY
    - docker build --cache-from $STAGING_LATEST_IMAGE --build-arg GIT_SHA=$CI_COMMIT_SHA -t $STAGING_IMAGE .
    - docker tag $STAGING_IMAGE $STAGING_LATEST_IMAGE
    - docker push $STAGING_IMAGE
    - docker push $STAGING_LATEST_IMAGE
  only:
    - master

deploy_staging:
  variables:
    DB_HOST: "profiledb"
    DB_PORT: 5432
    DB_USER: "dev_registration"
    DB_NAME: "profile"
    DB_PASSWORD: "password"
    APP_PORT: "7471"
    APP_MODE: "release"
    APP_ENV: "staging"
    SENDGRID_API_KEY: ${SENDGRID_API_KEY}
    SENTRY_DSN: ${STAGING_PROFILE_SENTRY_DSN}
  image: gitlab.bbdev.team:5050/vh/buildutils/buildutil:0.8.0
  stage: deploy
  tags:
    - staging
  script:
    - for variable in "${!DYN_STAGING@}"; do echo "${variable#DYN_STAGING_}"="${!variable}"; export "${variable#DYN_STAGING_}"="${!variable}"; done;
    - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN $CI_REGISTRY
    - IMAGE_NAME=$STAGING_IMAGE docker compose up -d --remove-orphans
  only:
    - master


build_production:
  image: docker:latest
  stage: build
  services:
    - docker:26.0.0-dind
  script:
    - env
    - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN $CI_REGISTRY
    - docker build --build-arg GIT_SHA=$CI_COMMIT_SHA -t $PROD_IMAGE .
    - docker push $PROD_IMAGE
  only:
    - tags

deploy_production:
  image: gitlab.bbdev.team:5050/vh/buildutils/buildutil:0.8.0
  stage: deploy
  tags:
    - production
  variables: 
    DB_HOST: ${PROD_PG_HOST}
    DB_PORT: ${PROD_PG_PORT} 
    DB_USER: ${PROD_PROFILE_DB_USER}
    DB_PASSWORD: ${PROD_PROFILE_DB_PASS}
    DB_NAME: ${PROD_PROFILE_DB_NAME}
    APP_PORT: "7471"
    APP_MODE: "release"
    APP_ENV: "production"
    SENDGRID_API_KEY: ${SENDGRID_API_KEY}
    SENTRY_DSN: ${PROD_PROFILE_SENTRY_DSN}
  script:
    - for variable in "${!DYN_PROD@}"; do echo "${variable#DYN_PROD_}"="${!variable}"; export "${variable#DYN_PROD_}"="${!variable}"; done;
    - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN $CI_REGISTRY
    - IMAGE_NAME=$PROD_IMAGE docker compose up -d vh-srv-profile
  only:
    - tags
  when: manual
